services:
  triton:
    image: ${TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:26.09-py3}
    command: ["tritonserver", "--model-repository=/models"]
    gpus: all
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./models:/models:ro
      - ./artifacts:/artifacts
